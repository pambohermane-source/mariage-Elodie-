<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Espace des mariés — Élodie & Stéphane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #FBF7F4; color: #2B2826; font-family: 'Jost', system-ui, sans-serif; font-weight: 300; }
  a { color: #C4664A; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: clamp(36px, 7vw, 56px); line-height: 1; margin: 0 0 6px; }
  h1 em { color: #C4664A; }
  .kicker { font-size: 12px; letter-spacing: .3em; text-transform: uppercase; color: #C4664A; margin: 0 0 14px; }
  .muted { color: #7A6D67; }
  .login { max-width: 420px; margin: 12vh auto 0; text-align: center; }
  .login input { width: 100%; font: inherit; font-size: 18px; padding: 16px 18px; border-radius: 16px; border: 1.5px solid #E4D3CB; background: #fff; text-align: center; letter-spacing: .1em; outline: none; margin: 22px 0 12px; }
  .login input:focus { border-color: #C4664A; }
  button, .btn { font: inherit; font-size: 12.5px; letter-spacing: .18em; text-transform: uppercase; border: none; border-radius: 100px; padding: 15px 24px; cursor: pointer; background: #2B2826; color: #FBF7F4; text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { background: #C4664A; color: #FBF7F4; }
  .btn.light { background: #fff; color: #2B2826; border: 1px solid #E4D3CB; }
  .btn.light:hover { border-color: #C4664A; background: #fff; color: #C4664A; }
  .err { color: #B0412A; min-height: 22px; font-size: 14px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 32px 0; }
  .stat { background: #fff; border: 1px solid #EEE3DE; border-radius: 22px; padding: 20px; }
  .stat.hl { background: linear-gradient(150deg, #F0AC93, #C4664A); color: #fff; border: none; }
  .stat b { display: block; font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 48px; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button { background: #fff; color: #2B2826; border: 1px solid #E4D3CB; padding: 10px 16px; font-size: 11.5px; }
  .filters button.on { background: #2B2826; color: #fff; border-color: #2B2826; }
  .search { font: inherit; font-size: 15px; padding: 12px 16px; border-radius: 100px; border: 1px solid #E4D3CB; background: #fff; outline: none; min-width: 220px; }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .row { background: #fff; border: 1px solid #EEE3DE; border-radius: 20px; padding: 18px 20px; display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; align-items: start; }
  .row .nom { font-family: 'Cormorant Garamond', serif; font-size: 26px; line-height: 1.1; }
  .row .meta { font-size: 13px; color: #7A6D67; }
  .row .mot { grid-column: 1 / -1; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 19px; color: #5E504A; margin-top: 4px; }
  .pill { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; padding: 7px 12px; border-radius: 100px; white-space: nowrap; }
  .p-tout { background: #F6D9CE; color: #8A4632; }
  .p-ceremonie { background: #FBEFEA; color: #8A4632; }
  .p-soiree { background: #ECE8E5; color: #4F4A46; }
  .p-absent { background: #F1EFED; color: #8E827C; }
  .nb { font-variant-numeric: tabular-nums; }
  .del { background: none; color: #B9A9A1; padding: 4px 0; font-size: 11px; letter-spacing: .14em; }
  .del:hover { background: none; color: #B0412A; }
  .empty { text-align: center; padding: 60px 20px; border: 1.5px dashed #E4D3CB; border-radius: 26px; }
  .hidden { display: none; }
  h2 { font-family: 'Cormorant Garamond', serif; font-weight: 300; font-size: 36px; margin: 56px 0 16px; }
</style>
</head>
<body>
<div class="wrap">

  <div id="login" class="login">
    <p class="kicker">Espace privé</p>
    <h1>Élodie <em>&amp;</em> Stéphane</h1>
    <p class="muted">Entrez votre code pour voir les confirmations.</p>
    <form id="f">
      <input id="code" type="password" placeholder="Code d'accès" autocomplete="current-password" required>
      <div class="err" id="err"></div>
      <button type="submit">Entrer</button>
    </form>
  </div>

  <div id="app" class="hidden">
    <div class="bar">
      <div>
        <p class="kicker">Espace des mariés</p>
        <h1>Les <em>confirmations</em></h1>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn light" id="refresh">Actualiser</button>
        <button class="btn" id="csv">Exporter (Excel)</button>
      </div>
    </div>
    <p class="muted" id="updated"></p>

    <div class="stats">
      <div class="stat hl"><b id="sTotal">0</b><span>Personnes attendues</span></div>
      <div class="stat"><b id="sCer">0</b><span>À la cérémonie</span></div>
      <div class="stat"><b id="sSoi">0</b><span>À la soirée</span></div>
      <div class="stat"><b id="sRep">0</b><span>Réponses reçues</span></div>
      <div class="stat"><b id="sAbs">0</b><span>Absents</span></div>
    </div>

    <div class="bar">
      <div class="filters" id="filters">
        <button data-f="all" class="on">Toutes</button>
        <button data-f="tout">Cérémonie + soirée</button>
        <button data-f="ceremonie">Cérémonie</button>
        <button data-f="soiree">Soirée</button>
        <button data-f="absent">Absents</button>
      </div>
      <input class="search" id="q" type="search" placeholder="Rechercher un nom…">
    </div>
    <div class="list" id="list"></div>

    <h2>Livre d'or</h2>
    <div class="list" id="livre"></div>
  </div>
</div>

<script>
const LABEL = { tout: "Cérémonie + soirée", ceremonie: "Cérémonie", soiree: "Soirée", absent: "Absent" };
let code = sessionStorage.getItem("es26-admin") || "";
let items = [], filter = "all";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s || "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (iso) => new Date(iso).toLocaleString("fr-FR", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

async function load() {
  const r = await fetch("/api/rsvp?code=" + encodeURIComponent(code), { cache: "no-store" });
  if (r.status === 401) { $("err").textContent = "Code incorrect."; sessionStorage.removeItem("es26-admin"); show(false); return; }
  const d = await r.json().catch(() => ({}));
  if (!d.ok) { $("err").textContent = d.error || "Erreur de chargement."; show(false); return; }
  sessionStorage.setItem("es26-admin", code);
  items = d.items; show(true); render();
  const lv = await fetch("/api/livre", { cache: "no-store" }).then((x) => x.json()).catch(() => []);
  $("livre").innerHTML = lv.length ? lv.map((m) => `<div class="row"><div class="nom">${esc(m.nom)}</div><div class="meta">${esc(m.date)}</div><div class="mot">« ${esc(m.texte)} »</div></div>`).join("") : '<div class="empty muted">Aucun message pour l\'instant.</div>';
  $("updated").textContent = "Mis à jour à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function show(on) { $("login").classList.toggle("hidden", on); $("app").classList.toggle("hidden", !on); }

function render() {
  const venus = items.filter((i) => i.presence !== "absent");
  const sum = (arr) => arr.reduce((a, i) => a + (i.nb || 0), 0);
  $("sTotal").textContent = sum(venus);
  $("sCer").textContent = sum(venus.filter((i) => i.presence === "tout" || i.presence === "ceremonie"));
  $("sSoi").textContent = sum(venus.filter((i) => i.presence === "tout" || i.presence === "soiree"));
  $("sRep").textContent = items.length;
  $("sAbs").textContent = items.filter((i) => i.presence === "absent").length;
  const q = $("q").value.trim().toLowerCase();
  const rows = items.filter((i) => (filter === "all" || i.presence === filter) && (!q || i.nom.toLowerCase().includes(q)));
  $("list").innerHTML = rows.length ? rows.map((i) => `
    <div class="row">
      <div class="nom">${esc(i.nom)}</div>
      <span class="pill p-${i.presence}">${LABEL[i.presence]}${i.presence !== "absent" ? ` · <span class="nb">${i.nb}</span> pers.` : ""}</span>
      <div class="meta">Répondu le ${fmt(i.date)}</div>
      <button class="del" data-id="${i.id}">Supprimer</button>
      ${i.mot ? `<div class="mot">« ${esc(i.mot)} »</div>` : ""}
    </div>`).join("") : '<div class="empty muted">Aucune réponse dans cette catégorie.</div>';
}

$("f").addEventListener("submit", (e) => { e.preventDefault(); code = $("code").value.trim(); $("err").textContent = ""; load(); });
$("refresh").addEventListener("click", load);
$("q").addEventListener("input", render);
$("filters").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("on", x === b));
  render();
});
$("list").addEventListener("click", async (e) => {
  const b = e.target.closest(".del"); if (!b) return;
  if (!confirm("Supprimer cette réponse ?")) return;
  await fetch("/api/rsvp?code=" + encodeURIComponent(code) + "&id=" + encodeURIComponent(b.dataset.id), { method: "DELETE" });
  load();
});
$("csv").addEventListener("click", () => {
  const head = ["Nom", "Présence", "Personnes", "Message", "Date de réponse"];
  const lines = [head].concat(items.map((i) => [i.nom, LABEL[i.presence], i.nb, i.mot || "", fmt(i.date)]));
  const csv = "\uFEFF" + lines.map((l) => l.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "confirmations-mariage.csv"; a.click();
});
if (code) load();
</script>
</body>
</html>
